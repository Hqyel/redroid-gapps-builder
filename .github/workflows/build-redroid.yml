
name: Build Redroid 12 with GApps and Chrome

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git lzip python3-venv

      - name: Download redroid-script
        run: |
          git clone --depth 1 \
            https://github.com/ayasa520/redroid-script.git

          python3 -m venv redroid-script/.venv

          redroid-script/.venv/bin/pip install \
            -r redroid-script/requirements.txt

      - name: Build GApps base image
        working-directory: redroid-script
        run: |
          set -e
          .venv/bin/python redroid.py -a 12.0.0 -mtg

          docker image inspect \
            redroid/redroid:12.0.0_mindthegapps

      - name: Validate Chrome APK files
        run: |
          set -e
          find apks/chrome -name '*.apk' | grep -q .
          find apks/trichrome -name '*.apk' | grep -q .

      - name: Build Chrome image
        run: |
          docker build \
            -f preload/Dockerfile \
            -t redroid12-gapps-chrome:arm64 \
            .

          ARCH=$(docker image inspect \
            --format '{{.Architecture}}' \
            redroid12-gapps-chrome:arm64)

          test "$ARCH" = "arm64"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      - name: Push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/redroid12-gapps-chrome:arm64"

          docker tag redroid12-gapps-chrome:arm64 "$IMAGE"
          docker push "$IMAGE"

          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
